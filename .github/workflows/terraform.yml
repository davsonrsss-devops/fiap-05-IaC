name: 'Terraform IaC'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      region_role:
        description: 'Role da Região no DR (active ou passive)'
        required: true
        default: 'active'
        type: choice
        options:
          - active
          - passive
      aws_region:
        description: 'Região da AWS (Primária ou DR)'
        required: true
        default: 'us-east-1'
        type: choice
        options:
          - us-east-1
          - us-west-2
      primary_ngo_db_arn:
        description: 'ARN do RDS Primário NGO (Obrigatório se passive)'
        required: false
        type: string
      primary_donation_db_arn:
        description: 'ARN do RDS Primário Donation (Obrigatório se passive)'
        required: false
        type: string

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: ${{ github.event.inputs.aws_region || 'us-east-1' }}
      TF_VAR_region_role: ${{ github.event.inputs.region_role || 'active' }}
      TF_VAR_primary_ngo_db_arn: ${{ github.event.inputs.primary_ngo_db_arn || '' }}
      TF_VAR_primary_donation_db_arn: ${{ github.event.inputs.primary_donation_db_arn || '' }}
      AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}

    defaults:
      run:
        working-directory: ./

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Init
      id: init
      run: terraform init

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    # Adicionamos um ambiente (opcional). No GitHub você pode configurar regras de proteção (Require approval)
    # para este environment "production" para que o apply não rode sem intervenção humana, mesmo no main.
    environment: production
    
    env:
      TF_VAR_aws_region: ${{ github.event.inputs.aws_region || 'us-east-1' }}
      TF_VAR_region_role: ${{ github.event.inputs.region_role || 'active' }}
      TF_VAR_primary_ngo_db_arn: ${{ github.event.inputs.primary_ngo_db_arn || '' }}
      TF_VAR_primary_donation_db_arn: ${{ github.event.inputs.primary_donation_db_arn || '' }}
      AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}

    defaults:
      run:
        working-directory: ./

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      id: init
      run: terraform init

    - name: Terraform Apply
      run: terraform apply -auto-approve
